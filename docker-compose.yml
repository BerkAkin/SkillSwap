services:
 
  laravel:
    build:
      context: ./ssbackend
      dockerfile: Dockerfile
    container_name: ss_laravel
    working_dir: /var/www/html
    volumes:
      - ./ssbackend:/var/www/html
      - ss_vendor:/var/www/html/vendor
    ports:
      - "8000:8000"
      - "8080:8080"
    command: php artisan serve --host=0.0.0.0 --port=8000
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=ss_db
      - DB_USERNAME=ss_user
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FILESYSTEM_DISK=s3
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_BUCKET=my-bucket
      - AWS_ENDPOINT=http://minio:9000
      - AWS_USE_PATH_STYLE_ENDPOINT=true
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - ss_network

  angular:
    build:
      context: ./ssclient
      dockerfile: Dockerfile
    container_name: ss_angular
    volumes:
      - ./ssclient:/app
      - ss_node_modules:/app/node_modules
    command: npm start -- --host 0.0.0.0 --poll=2000
    ports:
      - "4200:4200"
    depends_on:
      - laravel
    networks:
      - ss_network

  postgres:
    image: postgres:16-alpine
    container_name: ss_postgres
    environment:
      POSTGRES_DB: ss_db
      POSTGRES_USER: ss_user
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - ss_pgdata:/var/lib/postgresql/data
    networks:
      - ss_network

  redis:
    image: redis:alpine
    container_name: ss_redis
    ports:
      - "6379:6379"
    networks:
      - ss_network


  minio:
    image: minio/minio:latest
    container_name: ss_minio
    ports:
      - "9000:9000"
      - "9001:9001" 
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - ss_miniodata:/data
    networks:
      - ss_network

volumes:
  ss_pgdata:
  ss_miniodata:
  ss_node_modules:
  ss_vendor:
  
networks:
  ss_network:
    driver: bridge