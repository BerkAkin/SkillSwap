services:

  laravel:
    build:
      context: ./ssbackend
      dockerfile: Dockerfile
    container_name: ss_laravel
    working_dir: /var/www/html
    volumes:
      - ./ssbackend:/var/www/html
      - ss_vendor:/var/www/html/vendor
    ports:
      - "8000:8000"
      - "8080:8080"
    command: php artisan serve --host=0.0.0.0 --port=8000
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=ss_db
      - DB_USERNAME=ss_user
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
    networks:
      - ss_network

  angular:
    build:
      context: ./ssclient
      dockerfile: Dockerfile
    container_name: ss_angular
    volumes:
      - ./ssclient:/app
      - ss_node_modules:/app/node_modules
    command: npm start -- --host 0.0.0.0 --poll=2000
    ports:
      - "4200:4200"
    depends_on:
      - laravel
    networks:
      - ss_network

  postgres:
    image: postgres:16-alpine
    container_name: ss_postgres
    environment:
      POSTGRES_DB: ss_db
      POSTGRES_USER: ss_user
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - ss_pgdata:/var/lib/postgresql/data
    networks:
      - ss_network

  redis:
    image: redis:alpine
    container_name: ss_redis
    ports:
      - "6379:6379"
    networks:
      - ss_network

volumes:
  ss_pgdata:
  ss_node_modules:
  ss_vendor:

networks:
  ss_network:
    driver: bridge
