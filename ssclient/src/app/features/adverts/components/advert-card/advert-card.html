<div class="border border-gray-200 h-[200px] max-h-[200px] rounded-lg shadow-sm bg-white card">
    <div class="size-full container font-rubik">
        <div class="h-[20%] flex items-center justify-center bg-sky-500 rounded-t-lg">
            <p class="text-white font-normal">
                {{data()?.skill?.title}}
            </p>
        </div>
        <div class="h-[65%] flex items-center p-3 justify-center  border-y border-slate-200">
            <p class="text-sm text-slate-700 text-center">
                {{data()?.skill?.description}}
            </p>
        </div>
        <div class="h-[15%] flex items-center px-3 py-1 justify-between">
            <p class="text-orange-500">
                {{getStars()}} ★
            </p>
            <p class="text-sky-500 text-sm">
                {{data()?.username}} 
            </p>
        </div>
    </div>
    <!-- {{data()?.id}} -->
</div>
