<div class="bg-white border border-gray-200 shadow-md max-h-[200px] transition-all info-card">
    <div class="h-30">
        <div class="relative flex justify-center items-center py-4 px-2 ">
            <p class="px-2 leading-8 text-gray-600 font-rubik">{{data().comment}}
            <p class="absolute z-0 text-orange-600/10 text-9xl">{{data().point === 5 ?"★":""}}</p>
        </div>
    </div>
    <div class="h-10 border-t border-gray-200">
        <div class="flex relative justify-between h-full w-full items-center font-rubik">
            <p class="text-gray-700 font-medium p-5 text-center">{{data().user}}</p>
            <p class="text-orange-500 font-medium p-5 text-center">{{data().point}} ★</p>
        </div>
    </div>
</div>
