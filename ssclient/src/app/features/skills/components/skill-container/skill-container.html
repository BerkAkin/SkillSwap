<div class="container mx-auto overflow-hidden">
    <div class="my-2 py-2 flex pill-animate">
        @for (skill of skills(); track $index) {
        <app-skill-pill colorScheme="orange" text="{{skill.name}}" />
        }
        @for (skill of skills(); track $index) {
        <app-skill-pill colorScheme="orange" text="{{skill.name}}" />

    </div>
    <div class="py-2 flex  pill-reverse-animate">
        @for (skill of skills(); track $index) {
        <app-skill-pill colorScheme="sky" text="{{skill.name}}" />
        }
        @for (skill of skills(); track $index) {

        }
    </div>
</div>
