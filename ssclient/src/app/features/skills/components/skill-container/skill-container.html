<div class="container mx-auto">
    <div class="my-2 py-2 flex overflow-hidden">
        @for (skill of skills(); track $index) {
        <app-skill-pill colorScheme="orange" text="{{skill.name}}" />
        }
    </div>
    <div class="py-2 flex overflow-hidden">
        @for (skill of skills(); track $index) {
        <app-skill-pill colorScheme="sky" text="{{skill.name}}" />
        }
    </div>
</div>
