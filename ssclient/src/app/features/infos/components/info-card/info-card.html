<div class="bg-white border border-slate-200 rounded-md shadow-md min-h-[180px] transition-all info-card">
    <div class="h-10">
        <div class="flex justify-start items-center py-4 px-2">
            <p [ngClass]="data().color==='orange' ? 'bg-orange-500 border-orange-600':'bg-sky-500 border-sky-600'"
                class="text-white font-rubik border rounded-md px-2 font-medium title-axis">{{data().icon +
                data().title}}</p>
        </div>
    </div>
    <div class="h-30">
        <div class="flex relative justify-center h-full w-full items-center">
            <p class="absolute z-0 text-slate-200/60 text-9xl">{{data().icon}}</p>
            <p class=" z-10 leading-8 text-gray-600 font-rubik p-5 text-center">{{data().description}}</p>
        </div>
    </div>
</div>
