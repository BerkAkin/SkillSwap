<div class="p-8 min-h-[400px] flex items-center my-12">
  <div class="container mx-auto grid grid-cols-12 gap-6">
    <div [ngClass]="lefty() ? 'order-1' : 'order-2'" class="p-8 col-span-6 flex flex-col justify-center items-center">
      <div class="relative max-w-xl">
        <div class="bg-white shadow-sm rounded-md border border-slate-200">
          <img [ngSrc]="imagePath()!" width="100" height="100" class="h-full w-auto rounded-md" alt="Content Image" />
        </div>
        <div class="absolute border-2 border-dashed -z-10 w-full h-full rounded-md"
          [ngClass]="lefty()? 'left-3 bottom-3 border-sky-400' : 'right-3 bottom-3 border-orange-400'"></div>
      </div>
    </div>
    <div [ngClass]="lefty() ? 'order-2' : 'order-1'" class="col-span-6 flex flex-col justify-center">
      <h2 class="text-6xl font-semibold flex text-gray-800 font-changa ">
        <span class="me-2">
          {{ contentHeader() }}
        </span>
        <app-brand /> ?
      </h2>
      <p class="my-4 leading-8 text-lg text-gray-600 font-rubik max-h-[300px] overflow-hidden">
        {{ content() }}
      </p>
    </div>
  </div>
</div>
