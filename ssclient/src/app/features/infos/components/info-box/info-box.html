<div class="p-8 min-h-[400px] flex items-center">
  <div class="container mx-auto grid grid-cols-12 gap-6">
    <div class="order-1 col-span-6 flex flex-col justify-center">
      <h2 class="text-6xl font-semibold flex text-gray-800 font-changa ">
        <span class="me-2">
          {{ contentHeader() }}
        </span>
        <app-brand /> ?
      </h2>
      <p class="my-4 leading-10 text-lg text-gray-600 font-rubik max-h-[300px] overflow-hidden">
        {{ content() }}
      </p>
    </div>
    <div class="order-2 p-8 col-span-6 flex flex-col justify-center items-center">
      <div class="relative max-w-xl">
        <img [ngSrc]="imagePath()!" width="100" height="100" class="h-full w-auto " alt="Content Image" />
      </div>
    </div>
  </div>
</div>
