<form [formGroup]="resetForm" (ngSubmit)="resetAction()">
    <div class="my-4 items-center flex space-x-2">
        <div>
            <label class="text-gray-500 mb-1" for="currentPassword">Current Password: </label>
        </div>
        <div>
            <input formControlName="currentPassword" id="currentPassword" class="current-input" placeholder="123456789"
                type="password">
        </div>
    </div>
    <div class="flex justify-end mb-2">
        <button class="btn" type="submit">Send Reset Mail</button>
    </div>
</form>
