<form [formGroup]="resetForm" (ngSubmit)="resetAction()">
    <div>
        <label class="text-sm text-gray-700" for="currentPassword">Current Password</label>
        <input formControlName="currentPassword" id="currentPassword" class="miniInputs text-sm" placeholder="123456789"
            type="password">
    </div>
    <div class="flex justify-end">
        <button class="btn" type="submit">Reset Password</button>
    </div>
</form>
