@if(modalService.modalContent()){
<div class="modal-wrapper">
    <div class="modal-content">
        <div class="container-fluid min-w-[300px]">
            <div class="grid grid-cols-12 border-b border-gray-300 py-1">
                <div class="col-span-11">
                    <p class="font-rubik font-semibold text-lg text-gray-700">{{this.modalService.modalTitle()}}</p>
                </div>
                <div class="col-span-1">
                    <button class="close-button" (click)="modalService.closeModal()">X</button>
                </div>
            </div>
        </div>
        <div class="modal-element my-4">
            <ng-container
                *ngComponentOutlet="modalService.modalContent(); inputs:modalService.modalInputs()"></ng-container>
        </div>
    </div>
</div>

}
