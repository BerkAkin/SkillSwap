<div class="my-2">
    <div [ngClass]="isMe() ? 'bg-sky-500 justify-self-end':'bg-orange-500 justify-self-start'"
        class="p-2 max-w-[60%] min-w-[30%]">
        <p class="text-white">{{ message() }}</p>
        <div class="flex justify-end">
            <small class="text-xs text-white/70">{{ date()| date:'shortDate' }}</small>
        </div>
    </div>
</div>
