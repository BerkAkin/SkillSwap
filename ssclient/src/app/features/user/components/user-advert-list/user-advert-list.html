<div class="min-h-[600px] flex flex-col">
    <div class=" h-10 shrink-0 grid grid-cols-12">
        <div class="col-span-10 flex items-center">
            <p class="text-gray-700 text-xl font-rubik font-semibold">Your Adverts</p>
        </div>
        <div class="col-span-2 flex items-center space-x-2">
            <button class="page-button" (click)="this.userAdvertService.previousPage()">🡰</button>
            <button class="page-button" (click)="this.userAdvertService.nextPage()">🡲</button>
        </div>
    </div>
    <div class="flex-1 space-y-2">
        @for(advert of this.userAdvertService.userAdvertsResponse()?.data?.data; track advert.id){
        <div class="line-wrapper">
            <div class="col-span-3 col-def">
                <app-info-pill-component [text]="advert.status"
                    [colorScheme]="advert.status==='open' ? 'orange' : 'gray'" />
            </div>
            <div class="col-span-6 col-def ">
                <p class="text-sm text-gray-700 font-rubik">{{advert.skill.name}}</p>
            </div>
            <div class="col-span-3 col-def">
                <p class="text-sm text-gray-400">{{ advert.created_at | date:'dd.MM.yyyy'}}</p>
            </div>
        </div>
        }
    </div>
</div>
