<div class="min-h-[600px] flex flex-col">
    <div class="h-10 shrink-0 flex items-center justify-start">
        <p class="text-gray-700 text-xl font-rubik font-semibold">
            Offer Chat
        </p>
    </div>
    <div class="flex-1">
        @if(!userChatService.chatMessages()?.length) {
        <div class="text-center">
            <p class="text-gray-400 font-rubik text-sm ">
                Select an offer to start chatting or see past conversations
            </p>
        </div>
        }
        @else {
        <div class="flex-1 border border-gray-300">
            <div class="shrink-0 h-10 p-4 flex justify-between border-b border-gray-300 items-center">
                <p class="text-gray-700  font-semibold">
                    Berk Akın - C# Dersleri
                </p>
                <p class="text-gray-700  font-semibold">
                    Open
                </p>
            </div>
            <div #messageContainer (scroll)="onScroll()"
                class="flex flex-col flex-1 space-y-2 p-4 max-h-[400px] overflow-y-auto">
                @for (message of userChatService.chatMessages(); track $index) {
                @if(message.isMe) {
                <app-chat-bubble [message]="message.message" [date]="message.date"
                    [isMe]="message.isMe"></app-chat-bubble>
                } @else {
                <app-chat-bubble [message]="message.message" [date]="message.date"
                    [isMe]="message.isMe"></app-chat-bubble>
                }
                }
            </div>
            <div class="shrink-0 border-t border-gray-300 flex">
                <input class="message-input" type="text" [(ngModel)]="userMessage" placeholder="Message..." />
                <app-clickable-component class="send-button"
                    [properties]="{type:'button',text:'Send',colorScheme:'stone', btnType:'button', btnFn:onSendMessage.bind(this)}" />
            </div>
        </div>

        }

    </div>
</div>
