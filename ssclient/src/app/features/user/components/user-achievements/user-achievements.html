<div class="min-h-[400px]">
    <h4 class="text-gray-700 text-xl font-semibold mb-2 font-rubik">Achievements
        <span class="text-gray-400 border-b border-gray-300 text-base mx-1 font-normal">Milestones you've achieved
        </span>
    </h4>
    @for(achieve of this.achievementsService.achievements(); track achieve.id){
    <div class="relative inline-block mx-1">
        <img [appTooltipDirective]="achieve.description" [ngSrc]="'/assets/images/achievements/' + achieve.id + '.png'"
            width="50" height="50" class="w-[60px] cursor-pointer"
            [class]="this.userInfoService.userdata()?.achievements?.includes(achieve.id) ? '': 'grayscale'">
    </div>
    }

</div>
