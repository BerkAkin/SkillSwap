<div class="">
    <h4 class="text-gray-700 text-xl font-semibold mb-2">Achievements</h4>
    @for(achieve of this.achievementsService.achievements(); track achieve.id){
    <div class="relative inline-block mx-1">
        @if( this.userInfoService.userdata()?.achievements?.includes(achieve.id)){
        <img [appTooltipDirective]="achieve.description" [ngSrc]="'/assets/images/achievements/' + achieve.id + '.png'"
            width="50" height="50" class="w-[60px] cursor-pointer">
        }
        @else {
        <img [appTooltipDirective]="achieve.description" [ngSrc]="'/assets/images/achievements/' + achieve.id  + '.png'"
            width="50" height="50" class="grayscale w-[60px] cursor-pointer">
        }
    </div>
    }

</div>
