<div class="space-y-4 min-h-[400px] ">
    <p class="text-gray-700 font-semibold text-xl font-rubik">Settings
        <span class="text-gray-400 border-b border-gray-300 text-base mx-1 font-normal">Preferences about system
        </span>
    </p>
    <div class="my-2 space-y-3 flex flex-col p-1">
        @for(setting of this.settingService.settings(); track setting.id){
        <label>
            <input [checked]="this.userInfoService.userdata()?.settings?.includes(setting.id)" type="checkbox"
                class="chck">
            <span class="mx-1 text-gray-700 text-sm">{{setting.name}}</span>
        </label>
        }
    </div>
</div>
