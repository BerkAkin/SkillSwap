<div class=" min-h-[200px]">
    <div class="flex justify-between">
        <h4 class="text-gray-700 text-xl font-semibold">Skills</h4>
        <div class="space-x-2">
            <select
                class="w-[120px] text-sm p-1 text-gray-600 border shadow-sm bg-white border-gray-200 focus:outline-none font-semibold">
                <option value="">Skill</option>
            </select>
            <app-clickable-component
                [properties]="{type:'button',colorScheme:'emerald',text:'+', btnFn:()=>addSkill('1','skills')}" />
        </div>
    </div>
    <div class="my-2 max-h-[150px] overflow-auto">
        @for(skill of this.userInfoService.userdata()?.skills; track skill.id){
        <p
            class="me-2 my-2 py-1 ps-2 inline-block max-w-[300px] min-w-[60px] text-sm bg-gray-700 text-white font-semibold">
            ✦ {{skill.name}}
            <app-clickable-component class="mx-1"
                [properties]="{type:'button',colorScheme:'red',text:'X', btnFn:()=>removeSkill(skill.id,'skills')}" />
        </p>
        }
    </div>
</div>
<div class=" min-h-[300px] max-h-[300px]">
    <div class="flex justify-between">
        <h4 class="text-gray-700 text-xl font-semibold">Wishlist</h4>
        <div class="space-x-2">
            <select
                class="w-[120px] text-sm p-1 text-gray-600 border shadow-sm bg-white border-gray-200 focus:outline-none font-semibold">
                <option value="">Skill</option>
            </select>
            <app-clickable-component
                [properties]="{type:'button',colorScheme:'emerald',text:'+', btnFn:()=>addSkill('1','wishlist')}" />
        </div>
    </div>
    <div class="my-2 border border-gray-200 max-h-[250px] h-[250px] overflow-auto">
        <table class="text-left w-full">
            <thead>
                <tr class="font-rubik text-gray-700 text-sm border-b border-gray-200">
                    <th class="p-4">
                        <p class="block font-normal">Name</p>
                    </th>
                    <th class="p-4">
                        <p class="block font-normal">Description</p>
                    </th>
                    <th class="p-4">
                        <p class="block"></p>
                    </th>
                </tr>
            </thead>
            <tbody>
                @for(wish of this.userInfoService.userdata()?.wishlist; track wish.id){
                <tr class="hover:bg-gray-50 text-sm text-gray-600 font-rubik">
                    <td class="p-4">
                        <p class="block">{{ wish.name }}</p>
                    </td>
                    <td class="p-4">
                        <p class="block">{{ wish.description }}</p>
                    </td>
                    <td class="text-end px-2 text-sky-500">
                        <app-clickable-component
                            [properties]="{type:'button',colorScheme:'red',text:'X', btnFn:()=>removeSkill(wish.id,'wishlist')}" />
                    </td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>
