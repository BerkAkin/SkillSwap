<footer class="border border-slate-200 rounded-t-xl bg-white mt-20">
    <div class="grid grid-cols-12 gap-8 px-8 py-9">
        <div class="col-span-5">
            <a routerLink="/home">
                <app-brand />
            </a>
            <p class="text-gray-600 leading-8 font-rubik mt-4 max-w-md">
                A simple place to exchange knowledge, discover new skills,
                and learn from people with different experiences.
            </p>

            <div class="flex items-center gap-3 mt-2">
                <span class="text-gray-500">Learn</span>
                <span class="text-orange-400">→</span>
                <span class="text-gray-500">Share</span>
                <span class="text-sky-400">→</span>
                <span class="text-gray-500">Connect</span>
            </div>
        </div>

        <div class="col-span-3 flex-col flex items-center">
            <div class="grid grid-cols-1 gap-y-4 mt-2 font-rubik text-center text-gray-600 transition-colors">
                <app-clickable-component
                    [properties]="{type:'anchor',text:'Home', colorScheme:'stone', anchURL:'/home'}" />
                <app-clickable-component
                    [properties]="{type:'anchor',text:'Adverts', colorScheme:'stone', anchURL:'/adverts'}" />
                <app-clickable-component
                    [properties]="{type:'anchor',text:'About Me', colorScheme:'stone', anchURL:'/whoami'}" />
                <app-clickable-component
                    [properties]="{type:'anchor',text:'Register', colorScheme:'stone', anchURL:'/register'}" />
            </div>
        </div>
        <div class="col-span-4 flex flex-col items-end">
            <p class="text-gray-600 leading-8 font-rubik my-4">
                Discover something new or share what you already know.</p>
            <app-clickable-component
                [properties]="{type:'anchor',text:'Start Swapping ->', colorScheme:'orange', anchURL:'/register'}" />
        </div>
    </div>


    <div class="px-8 py-4 flex justify-between items-center border-t border-slate-200">
        <span class="text-xs text-slate-400">© 2026 SkillSwap</span>
        <div class="flex items-center gap-4 text-xs text-slate-400">
            <span>Skills are better when they're shared.</span>
            <span class="text-slate-200">|</span>
            <span> Built with<span class="text-orange-500"> curiosity</span></span>
        </div>
    </div>
</footer>
