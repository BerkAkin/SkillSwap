<div class="container mx-auto max-h-[800px] h-[800px] my-12">
    <div class="grid grid-cols-12">
        <div class="col-span-2"></div>
        <div class="col-span-10">
            <div class="flex justify-end">
                <app-clickable-component
                    [properties]="{type:'anchor',text:'Create Advert +', colorScheme:'emerald', anchURL:'/create-advert'}" />
            </div>
            <div class="grid grid-cols-12 gap-4">
                @for (advert of adverts()?.data; track advert.id) {
                <div class="col-span-2">
                    <app-advert-card [data]="advert" />
                </div>
                }
            </div>
            <div class="my-6">
                <app-advert-table [data]="adverts()" />
            </div>
        </div>
    </div>
</div>
