<div class="my-6">
    <div class="container mx-auto">
        <div class="my-2 py-2 flex overflow-hidden">
            @for (item of ["berk","asdsafsaf","dgskngsadlmgds","Bisiklete Binme Eğitimi","c4"]; track $index) {
                <app-skill-pill colorScheme="orange" text="{{item}}"/>
            }
        </div>
        <div class="py-2 flex overflow-hidden">
            @for (item of ["rasglete","fis","sadasfsafadlmgds","fffff","1245"]; track $index) {
                <app-skill-pill colorScheme="sky" text={{item}}/>    
            }
        </div> 
    </div>
</div>

<app-info-box content="
     SkillSwap is a skill-sharing platform where people can exchange their knowledge and abilities with others. 
     Instead of paying for a service, users can offer one of their own skills in return. 
     This allows people to learn new skills while sharing what they already know." 
    contentHeader="What is" imagePath="/assets/images/img.png"
/>


<app-info-section header="& Connect">
    @for (card of cards; track $index) {
        <app-info-card [data]="card"/>
    }
</app-info-section>


<app-info-box [lefty]="true" content="
    Users can browse different adverts and find skills they are interested in. 
    They can send an offer by exchanging their own skills. If both sides agree, 
    they can arrange a skill swap and use the chat feature to discuss the details. 
    This makes it easy for users to connect, share their skills, and learn something new." 
    contentHeader="How to" imagePath="/assets/images/ss.png"
/>  

<app-info-section header="Experiences">
    @for (comment of comments; track $index) {
        <app-comment-card [data]="comment"/>
    }
</app-info-section>
